services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fields
      POSTGRES_PASSWORD: fields
      POSTGRES_DB: fields
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fields -d fields"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://fields:fields@db:5432/fields
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
